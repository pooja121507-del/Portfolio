<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clothing</title>
</head>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}
.badge{
    position:absolute;
    top:10px;
    left:10px;
    background-color:rgb(240, 55, 55);
    color:white;
    padding:8px 15px;
    border-radius:10px;
}
.description{
    padding:2px;
    fontsize:10px;
}
.description span{
    padding:2px;
    fontsize:5px;
}
.aboutcloth{
    colour:rgb(182, 177, 177);
    font-size:15px;
    }
</style>
<body>
    <div class="clothing" id="static">
        <div class="image-container"></div>
        <img src="Ordset.png" alt="white co-ord set">
        <span class="badge">Value 350</span>
        <div class="description">
            <h2><span>20% off</span> White Co-ord Set</h2>
            </div>
            <div class="aboutcloth">
        <p><b>BLIVE</b> Tshirt Pant Co-Ords Set</p>
        </div>
    </div>
</body>
</html>
